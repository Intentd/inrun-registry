apiVersion: inrun.dev/v1
kind: Module
metadata:
  name: kafka
  version: v0.1.0
  description: >
    Apache Kafka StatefulSet in KRaft mode (no Zookeeper), persistent storage,
    headless Service for broker DNS, external Service, and Kafka UI management console.
  author: intentd
  license: Apache-2.0
  tags:
    - kafka
    - messaging
    - streaming
    - statefulset
    - storage
    - kraft
    - distributed
    - ui

inputs:
  - name: image
    description: Apache Kafka image (KRaft-capable)
    default: "apache/kafka:latest"

  - name: replicas
    description: Number of broker/controller replicas
    default: "1"

  - name: resourcePreset
    description: CPU/memory preset (tiny, small, medium, large, burst, steady, compute-heavy, memory-heavy)
    default: "compute-heavy"

  - name: volumeSize
    description: PVC storage size for the log directory
    default: "20Gi"

  - name: storageClass
    description: StorageClass for dynamic PVC provisioning
    default: "standard"

  - name: kafkaUiImage
    description: Kafka UI management console image
    default: "provectuslabs/kafka-ui:latest"

  - name: enableUI
    description: Deploy the Kafka UI management console (true/false)
    default: "true"

resources:
  statefulSets:
    - name: "{{ .metadata.name }}-kafka"
      image: "{{ .inputs.image }}"
      replicas: "{{ .inputs.replicas }}"
      serviceName: "{{ .metadata.name }}-kafka-headless"
      port: 9092
      resources:
        preset: "{{ .inputs.resourcePreset }}"
      reconcile: true
      probes:
        startup:
          type: tcp
          preset: slow-start
        liveness:
          type: tcp
          preset: standard
        readiness:
          type: tcp
          preset: standard
      volumeClaimTemplates:
        - name: data
          storageClass: "{{ .inputs.storageClass }}"
          storageSize: "{{ .inputs.volumeSize }}"
          mountPath: /var/lib/kafka/data
      env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://{{ .metadata.name }}-kafka-0.{{ .metadata.name }}-kafka-headless.{{ .metadata.namespace }}.svc.cluster.local:9092"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@{{ .metadata.name }}-kafka-0.{{ .metadata.name }}-kafka-headless.{{ .metadata.namespace }}.svc.cluster.local:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"

  services:
    - name: "{{ .metadata.name }}-kafka-headless"
      headless: true
      port: 9092
      targetPort: 9092
      reconcile: true

    - name: "{{ .metadata.name }}-kafka"
      port: 9092
      targetPort: 9092
      reconcile: true

    - name: "{{ .metadata.name }}-kafka-ui-svc"
      port: 8080
      targetPort: 8080
      type: LoadBalancer
      reconcile: true
      when:
        - field: inputs.enableUI
          equals: "true"

  deployments:
    - name: "{{ .metadata.name }}-kafka-ui"
      image: "{{ .inputs.kafkaUiImage }}"
      env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "{{ .metadata.name }}"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "{{ .metadata.name }}-kafka.{{ .metadata.namespace }}.svc.cluster.local:9092"
      port: 8080
      resources:
        preset: "{{ .inputs.resourcePreset }}"
      reconcile: true
      probes:
        liveness:
          type: http
          path: /actuator/health
          preset: standard
        readiness:
          type: http
          path: /actuator/health
          preset: standard
      when:
        - field: inputs.enableUI
          equals: "true"

status:
  fields:
    - path: kafkaReady
      value: "{{ allReplicasReady .children.statefulset }}"
    - path: bootstrapServers
      value: "{{ .metadata.name }}-kafka.{{ .metadata.namespace }}.svc.cluster.local:9092"
    - path: kafkaUiUrl
      value: "http://{{ .metadata.name }}-kafka-ui-svc.{{ .metadata.namespace }}.svc.cluster.local:8080"
