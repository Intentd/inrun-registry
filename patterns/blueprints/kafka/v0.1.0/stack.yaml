apiVersion: inrun.dev/v1
kind: Stack
metadata:
  name: kafka-example
  description: Example Stack showing how to consume the kafka pattern

imports:
  registry:
    - url: ghcr.io/intentd/registry/patterns/blueprints/kafka:v0.1.0
      oci: true

spec:
  crds:
    kafka:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s
