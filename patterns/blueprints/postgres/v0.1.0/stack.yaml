apiVersion: inrun.dev/v1
kind: Stack
metadata:
  name: postgres-example
  description: Example Stack showing how to consume the postgres pattern

imports:
  registry:
    - url: ghcr.io/intentd/registry/patterns/blueprints/postgres:v0.1.0
      oci: true

spec:
  crds:
    postgres:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s
