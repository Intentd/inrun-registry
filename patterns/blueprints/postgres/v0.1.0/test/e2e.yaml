apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: postgres-e2e
  description: End-to-end test for the postgres Blueprint
spec:
  cluster:
    name: inrun-e2e-postgres
    provider: kind
    reuse: false
  blueprint: ../blueprint.yaml
  crd: ../manifests/crd.yaml
  cr: ../manifests/cr.yaml
  expect:
    - name: "CR created"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Postgres
          name: my-postgres
          namespace: default

    - name: "StatefulSet running with correct replicas"
      after: cr-applied
      timeout: 300s
      resources:
        - kind: StatefulSet
          name: my-postgres-postgres
          namespace: default
          ready: true
      kubectl:
        get:
          - kind: StatefulSet
            name: my-postgres-postgres
            namespace: default
            field: .spec.replicas
            equals: "1"
          - kind: StatefulSet
            name: my-postgres-postgres
            namespace: default
            field: .spec.volumeClaimTemplates[0].spec.storageClassName
            equals: standard

    - name: "Service exists"
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Service
          name: my-postgres-postgres
          namespace: default

    - name: "CR deleted"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Postgres
          name: my-postgres
          namespace: default
          count: 0

    - name: "StatefulSet removed"
      after: cr-deleted
      timeout: 90s
      resources:
        - kind: StatefulSet
          name: my-postgres-postgres
          namespace: default
          count: 0
