apiVersion: inrun.dev/v1
kind: Stack
metadata:
  name: mongodb-example
  description: Example Stack showing how to consume the mongodb pattern

imports:
  registry:
    - url: ghcr.io/intentd/registry/patterns/blueprints/mongodb:v0.1.0
      oci: true

spec:
  crds:
    mongodb:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s
