apiVersion: inrun.dev/v1
kind: Stack
metadata:
  name: mysql-example
  description: Example Stack showing how to consume the mysql pattern

imports:
  registry:
    - url: ghcr.io/intentd/registry/patterns/blueprints/mysql:v0.1.0
      oci: true

spec:
  crds:
    mysql:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s
